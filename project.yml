name: WorkoutTracker
options:
  bundleIdPrefix: com.rafaellacerda.workouttracker
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Preencha com o Team ID da sua conta Apple Developer Program (Membership > Team ID).
    DEVELOPMENT_TEAM: ""

targets:
  WorkoutTracker:
    type: application
    platform: iOS
    sources:
      - Sources/WorkoutTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rafaellacerda.workouttracker
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: WorkoutTracker
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic

schemes:
  WorkoutTracker:
    build:
      targets:
        WorkoutTracker: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
