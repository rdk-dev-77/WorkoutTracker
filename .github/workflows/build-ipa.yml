name: Build unsigned IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto Xcode a partir do project.yml
        run: xcodegen generate

      - name: Build para iOS device (sem assinatura)
        run: |
          xcodebuild build \
            -project WorkoutTracker.xcodeproj \
            -scheme WorkoutTracker \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Empacotar .ipa não assinado
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/WorkoutTracker.app"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r WorkoutTracker-unsigned.ipa Payload
          rm -rf Payload

      - name: Publicar artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: WorkoutTracker-unsigned-ipa
          path: WorkoutTracker-unsigned.ipa
